name: CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Placeholders para variables que application.yml aun NO referencia hoy
    # (${SMTP_HOST}, ${GEMINI_API_KEY}) pero que los Modulos 2/4 del roadmap
    # (notificaciones por correo, chatbot Gemini) van a necesitar: Spring
    # falla al levantar el ApplicationContext si una property referenciada
    # con ${VAR} no tiene valor ni default. Se agregan ahora, en la rama de
    # infraestructura, para no tener que tocar CI otra vez cuando esas ramas
    # lleguen. En CI estos NUNCA deben ser credenciales reales: los tests de
    # EmailService/GeminiClient se mockean (ver Modulos 2.9/4.9), no pegan a
    # un SMTP o a Gemini de verdad.
    env:
      SMTP_HOST: localhost
      SMTP_PORT: 3025
      SMTP_USER: test
      SMTP_PASS: test
      GEMINI_API_KEY: dummy-key-para-ci

    # PrestamoMultaProcedureIntegrationTest es un @SpringBootTest real (sin
    # mocks, ver su Javadoc) que necesita una base Postgres y una instancia
    # de Redis alcanzables — igual que en desarrollo local vía
    # `docker compose up -d postgres redis`. GitHub Actions no levanta
    # docker-compose.yml por sí solo, así que se declaran acá como
    # "service containers" equivalentes.
    #
    # Mismos digests sha256 que docker-compose.yml (ver docs/DIGESTS-LOG.md):
    # se reutilizan a propósito, no un tag flotante como "postgres:16-alpine".
    # La razón no es la misma que en producción (ahí es supply-chain/
    # reproducibilidad de despliegue, ver adr-012-estrategia-despliegue.md) —
    # acá es simplemente evitar que CI valide el código contra una versión
    # de Postgres/Redis distinta de la que corre en desarrollo y en el
    # stack real, lo que podría enmascarar o inventar diferencias de
    # comportamiento entre entornos.
    services:
      postgres:
        image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: sgb_db
          POSTGRES_USER: sgb_user
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sgb_user -d sgb_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # El cliente psql no viene garantizado en la imagen de runner de
      # GitHub Actions entre versiones -- se instala explícitamente en vez
      # de asumir que ya está, para no depender de un detalle no
      # documentado de la imagen ubuntu-latest.
      - name: Instalar cliente psql
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client

      # Misma fuente de verdad que desarrollo local (docker-compose.yml
      # monta esto mismo en docker-entrypoint-initdb.d/): se genera el
      # consolidado (schema + los 7 procedimientos/funciones + seed) con el
      # mismo script que usa `make up`, y se aplica contra el servicio de
      # Postgres de CI con psql -- no se reescribe ni se duplica el DDL acá.
      - name: Inicializar esquema y procedimientos en Postgres (CI)
        env:
          PGPASSWORD: changeme
        run: |
          ./scripts/build-init-sql.sh
          psql -h localhost -p 5432 -U sgb_user -d sgb_db -v ON_ERROR_STOP=1 -f db/init/01-consolidado.sql

      # Host/puerto/usuario/password ya coinciden con los defaults de
      # application.yml (DB_URL localhost:5432/sgb_db, DB_USER sgb_user,
      # DB_PASSWORD changeme, REDIS_HOST/PORT localhost:6379) -- a
      # diferencia de docker-compose.yml, donde el host es el nombre del
      # servicio, un "service container" de GitHub Actions se expone en
      # localhost del runner. No hace falta ningún override de variables
      # de entorno para este step.
      - name: Build and run tests
        working-directory: ./backend-springboot
        run: ./mvnw -B clean verify

      # A.2.3 / criterio P3: `./mvnw verify` ya corrio spotbugs-maven-plugin
      # (con find-sec-bugs) como parte del step de arriba -- si aparecio un
      # hallazgo de severidad alta en las reglas de SQL dinamico
      # (spotbugs-security-include.xml), el step anterior ya fallo el
      # pipeline antes de llegar aca. Este step no vuelve a correr el
      # analisis: solo archiva el XML/HTML ya generado en target/ como
      # artifact de la corrida, para que quede accesible desde GitHub
      # Actions sin tener que reproducir la build localmente.
      - name: Archivar reporte de SpotBugs + find-sec-bugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-findsecbugs-report
          path: |
            backend-springboot/target/spotbugs.xml
            backend-springboot/target/spotbugs.html
          if-no-files-found: error

      # A.3.3: rechaza el commit si la matriz de trazabilidad tiene un
      # requisito Must sin historia_usuario/caso_de_uso, o un requisito
      # marcado como "verificado" sin una prueba automatizada real que lo
      # respalde. Ver scripts/validate-traceability.sh para el detalle de
      # las reglas.
      - name: Validar matriz de trazabilidad
        run: ./scripts/validate-traceability.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend-angular
        run: npm ci

      # No hay "lint" en package.json todavia (el proyecto no tiene
      # @angular-eslint instalado ni un builder "lint" en angular.json) --
      # agregarlo implica una dependencia nueva y una decision de reglas de
      # estilo que no es parte del alcance de esta rama (infraestructura de
      # CI). Se deja marcado explicitamente como pendiente en vez de omitirlo
      # en silencio, mismo criterio que "make bench"/"make audit" en el
      # Makefile.
      - name: Lint (pendiente)
        working-directory: ./frontend-angular
        run: |
          echo "Pendiente: agregar @angular-eslint y el script 'lint' a package.json."

      # --browsers=ChromeHeadless: 'ng test' por defecto abre Karma con un
      # navegador interactivo, lo que cuelga cualquier runner de CI sin
      # display. No hace falta un karma.conf.js propio (el proyecto usa el
      # builder por defecto @angular-devkit/build-angular:karma, ver
      # angular.json): el flag alcanza como override desde la CLI.
      - name: Tests (modo headless)
        working-directory: ./frontend-angular
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build de producción
        working-directory: ./frontend-angular
        run: npx ng build
