services:
  postgres:
    # Pinado por digest: postgres:16-alpine (2026-07-22).
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: sgb_postgres
    environment:
      POSTGRES_DB: sgb_db
      POSTGRES_USER: sgb_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Snapshot reproducible: solo corre en volumen vacío. `make up` lo regenera (ver Makefile).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgb_user -d sgb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinado por digest: redis:7-alpine (2026-07-22).
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: sgb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Contexto = raíz del repo: el Dockerfile también copia database/migrations/.
    build:
      context: .
      dockerfile: backend-springboot/Dockerfile
    container_name: sgb_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sgb_db
      DB_USER: sgb_user
      DB_PASSWORD: changeme
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Límites de memoria para el free tier de Render (512MB).
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms128m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC -XX:MaxRAM=450m"
      # En dev queda vacío para mantener Swagger; en prod se usa =prod.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CACHE_LIBROS_TTL_SECONDS: ${CACHE_LIBROS_TTL_SECONDS:-300}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      JWT_SECRET: ${JWT_SECRET}
      # Flyway dentro del contenedor (/app) vs local (backend-springboot/).
      SPRING_FLYWAY_LOCATIONS: filesystem:database/migrations
      # SMTP/Gemini/Brevo: vacíos en dev no rompen el arranque.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgb-saas.local}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend-angular
    container_name: sgb_frontend
    ports:
      - "14200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5

  backup-service:
    build:
      context: ./backup-service
      dockerfile: ./Dockerfile
    container_name: sgb_backup_service
    environment:
      DATABASE_URL: postgres://sgb_user:changeme@postgres:5432/sgb_db
      # El Postgres local de compose corre con ssl=off: sin esto el Pool
      # intentaria TLS y /health quedaria en 503 (unhealthy).
      DB_SSL: "false"
      DB_URL: ${DB_URL:-}
      DB_USER: sgb_user
      DB_PASSWORD: changeme
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
