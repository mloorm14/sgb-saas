services:
  postgres:
    # Pinado por digest sha256 (ver docs/DIGESTS-LOG.md): postgres:16-alpine,
    # obtenido con `docker pull` + `docker inspect` el 2026-07-22.
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: sgb_postgres
    environment:
      POSTGRES_DB: sgb_db
      POSTGRES_USER: sgb_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Snapshot reproducible (ver docs/adr/adr-006-estrategia-schema-reproducible.md):
      # solo se ejecuta en la primera inicialización de un volumen vacío.
      # Se monta db/init/ (generado por scripts/build-init-sql.sh a partir
      # de schema.sql + procs/*.sql + seed.sql concatenados) y NO el
      # directorio db/ completo: PostgreSQL no recorre subdirectorios de
      # docker-entrypoint-initdb.d/, así que db/procs/ nunca se ejecutaría
      # si se montara db/ tal cual. `make up` regenera db/init/ antes de
      # levantar el contenedor — ver Makefile.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgb_user -d sgb_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Pinado por digest sha256 (ver docs/DIGESTS-LOG.md): redis:7-alpine,
    # obtenido con `docker pull` + `docker inspect` el 2026-07-22.
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: sgb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Contexto = raíz del repo (no ./backend-springboot): el Dockerfile
    # necesita copiar también database/migrations/ (fuente única de Flyway,
    # ver application.yml — ya no se duplica dentro de src/main/resources/).
    build:
      context: .
      dockerfile: backend-springboot/Dockerfile
    container_name: sgb_backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sgb_db
      DB_USER: sgb_user
      DB_PASSWORD: changeme
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Limites de memoria del contenedor backend para caber en el free tier
      # de Render (512MB). MaxMetaspaceSize=100m era demasiado bajo: Spring
      # Boot + springdoc/Hibernate llenaban el metaspace al cargar clases y
      # el contenedor moria con OutOfMemoryError: Metaspace. 224m deja margen
      # de arranque; heap 300m max / 128m inicial + SerialGC + MaxRAM=450m.
      JAVA_TOOL_OPTIONS: "-Xmx300m -Xms128m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC -XX:MaxRAM=450m"
      # Modulo 10.2 (REQ-NF-014): activa el perfil 'prod' de application.yml
      # (Swagger UI/OpenAPI deshabilitados, sin stacktraces en /error) --
      # ver ADR-015 y docs/mediciones/sec/2026-08-10-owasp-a05-fix-*.md.
      # Default vacio a proposito: en desarrollo local (este
      # docker-compose.yml) el equipo sigue necesitando Swagger para
      # probar endpoints a mano (ver Seccion 0.4 del roadmap, sobre no
      # mergear seguridad demasiado temprano). Se activa solo poniendo
      # SPRING_PROFILES_ACTIVE=prod en .env para un despliegue real.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CACHE_LIBROS_TTL_SECONDS: ${CACHE_LIBROS_TTL_SECONDS:-300}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      JWT_SECRET: ${JWT_SECRET}
      # Sobreescribe el default de application.yml (filesystem:../database/migrations,
      # pensado para `mvnw`/jar local): dentro del contenedor el cwd es /app
      # y el Dockerfile copia database/migrations a /app/database/migrations.
      SPRING_FLYWAY_LOCATIONS: filesystem:database/migrations
      # Módulos 2 (notificaciones por correo) y 4 (chatbot Gemini) del
      # roadmap -- application.yml todavía no las referencia (${SMTP_HOST}
      # etc.), así que hoy no hacen nada, pero se agregan ya en la rama de
      # infraestructura para no volver a tocar docker-compose.yml cuando
      # esas ramas lleguen. Sin valor real en .env, Docker Compose las deja
      # vacías (no falla el arranque, a diferencia de Spring con ${VAR} sin
      # default, ver el comentario equivalente en .github/workflows/ci.yml).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@sgb-saas.local}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3/smtp/email}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend-angular
    container_name: sgb_frontend
    ports:
      - "14200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
