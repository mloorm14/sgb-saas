# SonarQube local — proyecto sgb-saas (ver MCP_GUIDE / guía del equipo).
# Servidor: docker run -d --name sonarqube -p 9000:9000 sonarqube:lts-community
# Escaneo: npx sonar-scanner "-Dsonar.host.url=http://localhost:9000" "-Dsonar.login=$env:SONAR_TOKEN"
# (token por variable de entorno, NUNCA en este archivo ni en commits).
sonar.projectKey=sgb-saas
sonar.projectName=sgb-saas
sonar.sources=backend-springboot/src/main,frontend-angular/src
sonar.tests=backend-springboot/src/test,frontend-angular/src
sonar.test.inclusions=**/*.spec.ts,**/*Test.java
sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/.angular/**,graphify-out/**,**/*.spec.ts
sonar.java.binaries=backend-springboot/target/classes
sonar.coverage.jacoco.xmlReportPaths=backend-springboot/target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8
