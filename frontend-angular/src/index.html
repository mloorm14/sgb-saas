<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Leibri — Sistema de Gestión Bibliotecaria</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Leibri: sistema de gestión bibliotecaria web para la modernización de bibliotecas institucionales y municipales, con préstamos, reservaciones, multas y catálogo de libros.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica la clase 'dark' antes de que Angular arranque, para evitar un
    // flash de tema incorrecto en la primera pintura. Misma logica que
    // ThemeService.leerPreferenciaInicial() -- si cambia una, cambiar la otra.
    (function () {
      try {
        var guardado = localStorage.getItem('theme:mode');
        var oscuro = guardado === 'dark' || (guardado !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (oscuro) document.documentElement.classList.add('dark');
      } catch (e) {
        // localStorage/matchMedia inaccesible (navegacion privada, etc.): se
        // queda en modo claro, no rompe el arranque de la app por esto.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
