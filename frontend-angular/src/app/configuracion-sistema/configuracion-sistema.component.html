<div style="padding:2rem;max-width:900px;margin:0 auto">

  <h2 style="color:#005c2f;margin:0 0 1.5rem 0">Configuración del sistema</h2>

  <div *ngIf="!esAdmin" style="color:#c0392b;padding:2rem;text-align:center">
    No tenés permisos para ver esta sección.
  </div>

  <ng-container *ngIf="esAdmin">
    <div *ngIf="errorMsg" style="color:red;margin-bottom:1rem">{{ errorMsg }}</div>
    <div *ngIf="cargando" style="text-align:center;padding:2rem">Cargando configuración...</div>

    <table *ngIf="!cargando && configuraciones.length > 0" style="width:100%;border-collapse:collapse;font-size:14px">
      <thead>
        <tr style="background:#005c2f;color:white">
          <th style="padding:10px;text-align:left">Clave</th>
          <th style="padding:10px;text-align:left">Valor</th>
          <th style="padding:10px;text-align:left">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let config of configuraciones; let i = index"
          [style.background]="i % 2 === 0 ? '#f9f9f9' : 'white'">
          <td style="padding:10px">{{ config.clave }}</td>
          <td style="padding:10px">
            <span *ngIf="claveEditando !== config.clave">{{ config.valor }}</span>
            <ng-container *ngIf="claveEditando === config.clave">
              <input [(ngModel)]="valorEditando" [ngModelOptions]="{standalone: true}" type="text"
                [maxlength]="valorMaxLength"
                style="padding:6px;border:1px solid #ccc;border-radius:4px;width:100%;box-sizing:border-box"/>
              <div style="font-size:12px;color:#888;margin-top:2px">{{ valorEditando.length }}/{{ valorMaxLength }}</div>
            </ng-container>
          </td>
          <td style="padding:10px;display:flex;gap:8px">
            <ng-container *ngIf="claveEditando !== config.clave">
              <button (click)="iniciarEdicion(config)"
                style="padding:4px 10px;background:#005c2f;color:white;border:none;border-radius:4px;cursor:pointer">
                Editar
              </button>
            </ng-container>
            <ng-container *ngIf="claveEditando === config.clave">
              <button [disabled]="!valorEditando.trim() || valorEditando.length > valorMaxLength"
                (click)="guardarValor()"
                style="padding:4px 10px;background:#005c2f;color:white;border:none;border-radius:4px;cursor:pointer">
                Guardar
              </button>
              <button (click)="cancelarEdicion()"
                style="padding:4px 10px;border:1px solid #ccc;border-radius:4px;cursor:pointer">
                Cancelar
              </button>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!cargando && configuraciones.length === 0" style="text-align:center;padding:2rem;color:#888">
      No hay parámetros de configuración
    </div>
  </ng-container>

</div>
