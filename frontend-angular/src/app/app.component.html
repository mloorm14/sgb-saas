<a href="#contenido-principal"
   class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[9999] focus:bg-primary focus:text-on-primary focus:px-4 focus:py-2 focus:rounded-lg focus:font-label-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
  Saltar al contenido principal
</a>

<div class="sr-only" aria-live="polite" aria-atomic="true">{{ rutaAnnouncement }}</div>

@if (false) {
  <!-- Header superior eliminado: la navegación vive en sidebars (dashboard-*) y en nav propio de portal-publico/detalle-publico (Iniciar sesión / Crear cuenta). Se mantiene oculto para evitar doble header en login/registro y en dashboards. -->
}

<app-loader />
<app-confirm-dialog />

<router-outlet />

@if (esLector() && !enRutaLector) {
  <app-chatbot-widget />
}

@if (confirmacionVisible) {
  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" (click)="cancelarConfirmacion()">
    <div role="alertdialog" aria-modal="true" aria-labelledby="titulo-confirmacion" tabindex="-1"
         appFocusTrap (cerrar)="cancelarConfirmacion()"
         class="bg-surface rounded-xl shadow-xl p-xl max-w-sm w-full" (click)="$event.stopPropagation()">
      <h3 id="titulo-confirmacion" class="font-headline-md text-headline-md text-on-surface mb-md">{{ confirmacionMensaje }}</h3>
      <div class="flex gap-sm justify-end">
        <button (click)="cancelarConfirmacion()"
                class="px-4 py-2 rounded-full font-label-lg text-label-lg border border-outline-variant text-on-surface-variant hover:bg-surface-container-low transition-colors cursor-pointer">
          Cancelar
        </button>
        <button (click)="confirmarAccion()"
                class="px-4 py-2 rounded-full font-label-lg text-label-lg bg-error text-white hover:bg-error/80 transition-colors cursor-pointer">
          Confirmar
        </button>
      </div>
    </div>
  </div>
}
