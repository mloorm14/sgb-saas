<main class="max-w-container-max mx-auto px-md md:px-lg py-lg">

  <div class="mb-lg">
    <h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-xs">
      Bienvenido, Bibliotecario
    </h1>
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      Reservaciones que vencen hoy
    </p>
  </div>

  <!-- Reservaciones de hoy -->
  <app-reservaciones-hoy-card
    [reservaciones]="reservacionesHoy"
    [cargando]="cargandoReservacionesHoy"
    [error]="errorReservacionesHoy"
    (marcarListaParaRetiro)="marcarListaParaRetiro($event)" />

</main>
