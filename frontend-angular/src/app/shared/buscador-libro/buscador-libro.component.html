<div class="relative max-w-md">
  <div class="rounded border border-outline-variant bg-white flex items-center px-sm">
    <span class="material-symbols-outlined text-outline text-[20px] mr-xs">search</span>
    <input
      type="text"
      [(ngModel)]="texto"
      (ngModelChange)="onBusquedaChange()"
      placeholder="Buscar libro por título..."
      class="w-full bg-transparent border-none focus:ring-0 py-sm font-body-sm text-body-sm text-on-surface placeholder-outline"
    />
    @if (buscando) {
      <span class="material-symbols-outlined text-outline text-[16px] animate-spin">progress_activity</span>
    }
  </div>

  @if (sugerencias.length > 0) {
    <div class="absolute mt-xs w-full bg-white rounded shadow-lg border border-outline-variant overflow-hidden z-10">
      @for (libro of sugerencias; track libro.id) {
        <button
          type="button"
          (click)="seleccionar(libro)"
          class="w-full text-left px-md py-sm hover:bg-surface-container-low font-body-sm text-body-sm text-on-surface">
          {{ libro.titulo }}
          @if (!libro.disponible) {
            <span class="text-outline font-label-sm text-[11px] ml-xs">· sin stock</span>
          }
        </button>
      }
    </div>
  }
</div>
