<!DOCTYPE html>

<style>
  body { font-family: 'Inter', sans-serif; background:#f8f9ff; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align:middle; }
  .glass-panel { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
</style>

<body class="bg-surface min-h-screen p-lg flex items-center justify-center">
<main class="w-full max-w-sm">

  <div class="text-center mb-lg">
    <h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Mi credencial</h1>
    <p class="font-body-sm text-body-sm text-on-surface-variant">Mostrala en el mostrador para préstamos rápidos</p>
  </div>

  <div class="rounded-2xl overflow-hidden shadow-xl" style="background: linear-gradient(135deg, #003694 0%, #1e4db7 60%, #2c57c1 100%);">
    <div class="p-lg pb-md flex items-center justify-between">
      <div class="flex items-center gap-xs text-white">
        <span class="material-symbols-outlined text-[24px]" style="font-variation-settings:'FILL' 1;">menu_book</span>
        <span class="font-headline-md text-[18px] font-bold">SGB UTEQ</span>
      </div>
      <span class="font-label-sm text-[10px] text-white/70 tracking-widest uppercase">Carné digital</span>
    </div>

    <div class="bg-white mx-md rounded-xl p-lg flex flex-col items-center mb-md">
      <div class="w-40 h-40 rounded-lg bg-surface-container-low flex items-center justify-center overflow-hidden mb-sm">
        <svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
          <rect width="150" height="150" fill="#ffffff"/>
          <g fill="#0d1c2e">
            <rect x="8" y="8" width="32" height="32"/><rect x="16" y="16" width="16" height="16" fill="#fff"/>
            <rect x="110" y="8" width="32" height="32"/><rect x="118" y="16" width="16" height="16" fill="#fff"/>
            <rect x="8" y="110" width="32" height="32"/><rect x="16" y="118" width="16" height="16" fill="#fff"/>
            <rect x="50" y="8" width="8" height="8"/><rect x="66" y="8" width="8" height="8"/><rect x="82" y="16" width="8" height="8"/>
            <rect x="50" y="50" width="50" height="50"/><rect x="63" y="63" width="24" height="24" fill="#fff"/>
            <rect x="50" y="118" width="8" height="8"/><rect x="74" y="126" width="8" height="8"/><rect x="100" y="118" width="8" height="8"/>
            <rect x="118" y="58" width="8" height="8"/><rect x="126" y="76" width="8" height="8"/><rect x="118" y="94" width="8" height="8"/>
          </g>
        </svg>
      </div>
      <p class="font-headline-md text-[17px] text-on-background font-semibold">Moisés Panamá</p>
      <p class="font-label-sm text-[12px] text-on-surface-variant">LECTOR · #4821</p>
    </div>

    <div class="px-lg pb-lg pt-xs flex items-center justify-between">
      <p class="font-label-sm text-[11px] text-white/60">Válida mientras la cuenta esté activa</p>
      <span class="material-symbols-outlined text-white/60 text-[18px]">verified</span>
    </div>
  </div>

  <button class="w-full mt-lg h-11 rounded-lg border border-outline-variant bg-white text-on-surface font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-surface-container-low transition-colors">
    <span class="material-symbols-outlined text-[20px]">download</span> Descargar credencial
  </button>

  <p class="text-center font-label-sm text-[11px] text-on-surface-variant mt-sm">GET /api/v1/credencial-qr/mi-credencial — resuelto por token, nunca por ID en la URL</p>
</main>
</body>
</html>
