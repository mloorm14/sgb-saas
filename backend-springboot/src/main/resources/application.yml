spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sgb_db}
    username: ${DB_USER:sgb_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    # Fuente única de migraciones (raíz del repo). El contenedor la recibe vía SPRING_FLYWAY_LOCATIONS.
    locations: filesystem:../database/migrations
    baseline-on-migrate: true
    # V39_2 quedo por debajo del tope ya aplicado en prod: sin esto Flyway la
    # rechaza en validacion (outOfOrder=false). CREATE OR REPLACE la hace
    # inocua al aplicar tarde; en BDs nuevas conserva su orden ante V40.
    out-of-order: true
    # baseline-version = migración más alta ya incluida en db/schema.sql. Subirla al agregar una migración nueva.
    baseline-version: 48
  data:
    redis:
      # En local sin password ni TLS; en prod (Upstash) con ambos.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  # Módulo 2/9.5: SMTP y Brevo. En local funcionan sin .env; en CI el puerto lo pone GreenMail.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  brevo:
    api-key: ${BREVO_API_KEY:}
    api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  # Uploads multipart (5MB). El límite de negocio de portadas (2MB) lo aplica LibroService con 400 legible.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  # El TLS lo termina el proxy; Spring solo confía en X-Forwarded-*.
  forward-headers-strategy: framework

# Notificaciones por correo (desactivadas por defecto; activar solo con SMTP listo).
notificaciones:
  remitente: ${MAIL_FROM:no-reply@sgb-saas.local}
  email:
    habilitado: ${NOTIF_EMAIL_HABILITADO:false}
  # Minutos antes de fecha_devolucion_estimada para avisar vencimientos.
  minutos-anticipacion-vencimiento: ${NOTIF_MINUTOS_ANTICIPACION_VENCIMIENTO:15}

app:
  cache:
    libros:
      # TTL del listado de libros (GET /api/v1/libros). Se invalida con @CacheEvict al mutar.
      ttl-seconds: ${CACHE_LIBROS_TTL_SECONDS:300}
    sugerencias:
      # TTL del autocompletado (GET /api/v1/libros/sugerencias). Sin evict: expira solo por TTL corto.
      ttl-seconds: ${CACHE_SUGERENCIAS_TTL_SECONDS:8}
  security:
    login:
      # Ventana e intentos máximos de login antes del 429.
      rate-limit-window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
  verificacion-correo:
    # TTL del código de 6 dígitos en Redis.
    ttl-minutes: ${VERIFICACION_CORREO_TTL_MINUTES:10}
  google-books:
    # API pública sin key para /volumes?q=isbn:.
    url-base: ${GOOGLE_BOOKS_URL_BASE:https://www.googleapis.com/books/v1}
    timeout-ms: ${GOOGLE_BOOKS_TIMEOUT_MS:8000}
  open-library:
    url-base: ${OPEN_LIBRARY_URL_BASE:https://openlibrary.org}
  gemini:
    # Chatbot asistente virtual (API key de Google AI Studio).
    api-key: ${GEMINI_API_KEY:}
    modelo: ${GEMINI_MODELO:gemini-3.5-flash-lite}
    url-base: ${GEMINI_URL_BASE:https://generativelanguage.googleapis.com/v1beta}
    timeout-ms: ${GEMINI_TIMEOUT_MS:8000}
    # Máximo de mensajes por usuario por minuto antes del 429.
    rate-limit-max-mensajes: ${CHATBOT_RATE_LIMIT_MAX_MENSAJES:10}
    rate-limit-window-seconds: ${CHATBOT_RATE_LIMIT_WINDOW_SECONDS:60}
  backup:
    r2:
      endpoint: ${R2_ENDPOINT:}
      access-key: ${R2_ACCESS_KEY_ID:}
      secret-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET_NAME:}
      account-id: ${R2_ACCOUNT_ID:}
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    storage-url: ${BACKUP_STORAGE_URL:}

security:
  jwt:
    # En prod usar JWT_SECRET real de 256 bits (Render Dashboard).
    secret: ${JWT_SECRET:CAMBIAR_EN_PRODUCCION_MIN_256_BITS}
    expiration-ms: 3600000
    refresh-expiration-ms: 10800000

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  health:
    mail:
      # El correo no define el health: SMTP caído no marca la app como unhealthy.
      enabled: false

---
# Perfil 'prod': sin stacktraces ni Swagger (solo depuración en dev).
spring:
  config:
    activate:
      on-profile: prod

server:
  error:
    # Sin detalle interno en /error (el dominio ya responde ProblemDetail limpio).
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

springdoc:
  # En producción Swagger expone el mapa de la API: solo fuera de este perfil.
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
