# ============================================================
# render.yaml — Blueprint de despliegue en Render (Bloque A.4.2)
# Prod real: biblora-sgb es Static Site (no Docker) — ver nota en servicio frontend.
# ============================================================

services:
  # ---- Backend Spring Boot ----
  - name: sgb-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend-springboot/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx300m -Xms128m -XX:MaxMetaspaceSize=224m -XX:+UseSerialGC -XX:MaxRAM=450m"
      - key: SPRING_FLYWAY_LOCATIONS
        value: filesystem:database/migrations
      - key: SMTP_PORT
        value: "587"
      - key: CACHE_LIBROS_TTL_SECONDS
        value: "300"
      - key: CACHE_SUGERENCIAS_TTL_SECONDS
        value: "8"
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: "900"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: BACKUP_STORAGE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: BACKUP_SERVICE_URL
        value: "http://backup-service:3000"
      - key: INTERNAL_API_KEY
        sync: false

  # ---- Frontend Angular ----
  # Prod real: Static Site (no Docker) — biblora-sgb en Render está como Static Site con
  # Root Directory: frontend-angular, Build Command: npm ci && npm run build,
  # Publish Directory: dist/frontend-angular/browser. Este bloque documenta el estado real
  # Static y no fuerza runtime docker (ver histórico bcb3baf7 que proponía Docker para 404 SPA).
  - name: biblora-sgb
    type: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend-angular/browser

  # ---- Microservicio Node.js para Backup Completo ----
  - name: backup-service
    type: pserv
    runtime: docker
    plan: free
    dockerfilePath: ./backup-service/Dockerfile
    dockerContext: ./backup-service
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: BACKUP_STORAGE_URL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
